<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daily Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<header class="bg-slate-10 text-slate-900 px-8 py-4 flex items-center justify-between shadow">
    <div class="flex items-center gap-4">
        <a href="/tasks" class="text-slate-600 hover:text-slate-900 text-sm transition">Task List</a>
        <span class="text-slate-400">/</span>
        <h1 class="text-xl font-bold tracking-wide">Daily Reports</h1>
    </div>
    <form action="/reports/generate" method="post" class="flex items-center gap-2">
        <input type="date" name="targetDt"
               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
               class="border border-slate-300 rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition cursor-pointer">
            + 보고서 생성
        </button>
    </form>
</header>

<main class="px-8 py-6">

    <div th:if="${message}"
         class="mb-4 px-4 py-3 bg-green-50 border border-green-300 text-green-800 rounded-xl text-sm"
         th:text="${message}"></div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-100 text-slate-900 text-xs tracking-wider">
            <tr>
                <th class="px-4 py-3 text-left w-14">ID</th>
                <th class="px-4 py-3 text-left w-32">기준일</th>
                <th class="px-4 py-3 text-left">분석 기간</th>
                <th class="px-4 py-3 text-right w-24">총 실행</th>
                <th class="px-4 py-3 text-right w-24">FAILURE</th>
                <th class="px-4 py-3 text-right w-24">ERROR</th>
                <th class="px-4 py-3 text-right w-24">성공률</th>
                <th class="px-4 py-3 text-center w-24">상태</th>
                <th class="px-4 py-3 text-left">생성일시</th>
                <th class="px-4 py-3 text-center w-20">보기</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:if="${#lists.isEmpty(reports)}">
                <td colspan="10" class="px-4 py-8 text-center text-slate-400">생성된 보고서가 없습니다.</td>
            </tr>
            <tr th:each="report : ${reports}" class="hover:bg-slate-50 transition">
                <td class="px-4 py-3 text-slate-600 font-mono text-xs" th:text="${report.reportId}"></td>
                <td class="px-4 py-3 font-semibold" th:text="${report.reportDt}"></td>
                <td class="px-4 py-3 text-xs text-slate-600">
                    <span th:text="${#temporals.format(report.analysisStartDtm, 'MM-dd HH:mm')}"></span>
                    ~
                    <span th:text="${#temporals.format(report.analysisEndDtm, 'MM-dd HH:mm')}"></span>
                </td>
                <td class="px-4 py-3 text-right font-mono" th:text="${#numbers.formatInteger(report.totalExecCnt, 0, 'COMMA')}"></td>
                <td class="px-4 py-3 text-right font-mono"
                    th:classappend="${report.failureCnt > 0} ? 'text-amber-600 font-semibold' : 'text-slate-600'"
                    th:text="${#numbers.formatInteger(report.failureCnt, 0, 'COMMA')}"></td>
                <td class="px-4 py-3 text-right font-mono"
                    th:classappend="${report.errorCnt > 0} ? 'text-red-600 font-semibold' : 'text-slate-600'"
                    th:text="${#numbers.formatInteger(report.errorCnt, 0, 'COMMA')}"></td>
                <td class="px-4 py-3 text-right text-xs"
                    th:text="${report.totalExecCnt > 0 ? #numbers.formatDecimal(report.successCnt * 100.0 / report.totalExecCnt, 1, 1) + '%' : 'N/A'}"></td>
                <td class="px-4 py-3 text-center">
                    <span th:if="${report.reportStatus == 'SUCCESS'}"
                          class="inline-block bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full">SUCCESS</span>
                    <span th:if="${report.reportStatus == 'ERROR'}"
                          class="inline-block bg-red-100 text-red-600 text-xs font-semibold px-2 py-0.5 rounded-full">ERROR</span>
                    <span th:if="${report.reportStatus == 'PENDING'}"
                          class="inline-block bg-slate-100 text-slate-500 text-xs font-semibold px-2 py-0.5 rounded-full">PENDING</span>
                </td>
                <td class="px-4 py-3 text-xs text-slate-600"
                    th:text="${#temporals.format(report.fstRegDtm, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td class="px-4 py-3 text-center">
                    <a th:href="@{|/reports/${report.reportId}|}"
                       class="text-blue-600 hover:underline text-xs font-medium">상세</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" class="mt-4 flex items-center justify-center gap-2 text-sm">
        <a th:if="${page > 0}" th:href="@{/reports(page=${page - 1}, size=${size})}"
           class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition">이전</a>
        <span class="px-3 py-1.5 text-slate-600"
              th:text="${page + 1} + ' / ' + ${totalPages}"></span>
        <a th:if="${page + 1 < totalPages}" th:href="@{/reports(page=${page + 1}, size=${size})}"
           class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition">다음</a>
    </div>

</main>
</body>
</html>
