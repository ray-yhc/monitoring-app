<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Detail</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<header class="bg-slate-10 text-slate-900 px-8 py-4 flex items-center gap-4 shadow">
    <a href="/reports" class="text-slate-600 hover:text-slate-900 text-sm transition">Daily Reports</a>
    <span class="text-slate-400">/</span>
    <h1 class="text-lg font-bold" th:text="${report.reportDt} + ' 일일 보고서'"></h1>
    <form action="/reports/generate" method="post" class="inline ml-auto">
        <input type="hidden" name="targetDt" th:value="${report.reportDt}">
        <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition cursor-pointer">
            재생성
        </button>
    </form>
</header>

<main class="px-8 py-6 space-y-6">

    <div th:if="${message}"
         class="px-4 py-3 bg-green-50 border border-green-300 text-green-800 rounded-xl text-sm"
         th:text="${message}"></div>

    <!-- 상태 배너 (ERROR인 경우) -->
    <div th:if="${report.reportStatus == 'ERROR'}"
         class="px-4 py-3 bg-red-50 border border-red-300 text-red-700 rounded-xl text-sm">
        <span class="font-semibold">보고서 생성 오류:</span>
        <span th:text="${report.errorMsg}"></span>
    </div>

    <!-- 집계 카드 -->
    <div class="grid grid-cols-2 gap-4 md:grid-cols-4">
        <div class="bg-white rounded-2xl shadow p-5 text-center">
            <div class="text-xs text-slate-500 mb-1">총 실행</div>
            <div class="text-2xl font-bold text-slate-800"
                 th:text="${#numbers.formatInteger(report.totalExecCnt, 0, 'COMMA')}"></div>
        </div>
        <div class="bg-white rounded-2xl shadow p-5 text-center">
            <div class="text-xs text-slate-500 mb-1">SUCCESS</div>
            <div class="text-2xl font-bold text-green-600"
                 th:text="${#numbers.formatInteger(report.successCnt, 0, 'COMMA')}"></div>
        </div>
        <div class="bg-white rounded-2xl shadow p-5 text-center">
            <div class="text-xs text-slate-500 mb-1">FAILURE</div>
            <div class="text-2xl font-bold"
                 th:classappend="${report.failureCnt > 0} ? 'text-amber-600' : 'text-slate-400'"
                 th:text="${#numbers.formatInteger(report.failureCnt, 0, 'COMMA')}"></div>
        </div>
        <div class="bg-white rounded-2xl shadow p-5 text-center">
            <div class="text-xs text-slate-500 mb-1">ERROR</div>
            <div class="text-2xl font-bold"
                 th:classappend="${report.errorCnt > 0} ? 'text-red-600' : 'text-slate-400'"
                 th:text="${#numbers.formatInteger(report.errorCnt, 0, 'COMMA')}"></div>
        </div>
    </div>

    <!-- 분석 기간 & 생성 정보 -->
    <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-4">보고서 정보</h2>
        <dl class="grid grid-cols-2 gap-x-8 gap-y-3 text-sm">
            <div class="flex gap-2">
                <dt class="text-slate-500 w-28 shrink-0">분석 시작</dt>
                <dd class="text-slate-700"
                    th:text="${#temporals.format(report.analysisStartDtm, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </div>
            <div class="flex gap-2">
                <dt class="text-slate-500 w-28 shrink-0">분석 종료</dt>
                <dd class="text-slate-700"
                    th:text="${#temporals.format(report.analysisEndDtm, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </div>
            <div class="flex gap-2">
                <dt class="text-slate-500 w-28 shrink-0">성공률</dt>
                <dd class="text-slate-700 font-semibold"
                    th:text="${report.totalExecCnt > 0 ? #numbers.formatDecimal(report.successCnt * 100.0 / report.totalExecCnt, 1, 1) + '%' : 'N/A'}"></dd>
            </div>
            <div class="flex gap-2">
                <dt class="text-slate-500 w-28 shrink-0">생성 상태</dt>
                <dd>
                    <span th:if="${report.reportStatus == 'SUCCESS'}"
                          class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full">SUCCESS</span>
                    <span th:if="${report.reportStatus == 'ERROR'}"
                          class="bg-red-100 text-red-600 text-xs font-semibold px-2 py-0.5 rounded-full">ERROR</span>
                    <span th:if="${report.reportStatus == 'PENDING'}"
                          class="bg-slate-100 text-slate-500 text-xs font-semibold px-2 py-0.5 rounded-full">PENDING</span>
                </dd>
            </div>
            <div class="flex gap-2">
                <dt class="text-slate-500 w-28 shrink-0">생성일시</dt>
                <dd class="text-slate-600 text-xs"
                    th:text="${#temporals.format(report.fstRegDtm, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </div>
            <div class="flex gap-2">
                <dt class="text-slate-500 w-28 shrink-0">최종수정</dt>
                <dd class="text-slate-600 text-xs"
                    th:text="${#temporals.format(report.fnlUptDtm, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </div>
        </dl>
    </div>

    <!-- 실행이력 요약 -->
    <div class="bg-white rounded-2xl shadow p-6" th:if="${report.execSummary != null}">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-3">실행이력 요약</h2>
        <p class="text-slate-800 font-medium" th:text="${report.execSummary}"></p>
    </div>

    <!-- AI 조언 -->
    <div class="bg-white rounded-2xl shadow p-6" th:if="${report.aiAdvice != null}">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-4">AI 조언</h2>
        <div id="aiAdviceContent" class="text-sm text-slate-800 leading-relaxed whitespace-pre-line"
             th:text="${report.aiAdvice}"></div>
    </div>

</main>

<script>
(function () {
    const el = document.getElementById('aiAdviceContent');
    if (!el) return;

    el.innerHTML = el.textContent
        .replace(/\[심각\]/g, '<span class="inline-block bg-red-100 text-red-700 text-xs font-bold px-1.5 py-0.5 rounded mr-1">[심각]</span>')
        .replace(/\[주의\]/g, '<span class="inline-block bg-amber-100 text-amber-700 text-xs font-bold px-1.5 py-0.5 rounded mr-1">[주의]</span>')
        .replace(/\[일반\]/g, '<span class="inline-block bg-slate-100 text-slate-600 text-xs font-bold px-1.5 py-0.5 rounded mr-1">[일반]</span>');
})();
</script>
</body>
</html>
