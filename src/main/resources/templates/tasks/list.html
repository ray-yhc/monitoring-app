<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<!-- Top Nav -->
<header class="bg-slate-10 text-slate-900 px-8 py-4 flex items-center justify-between shadow">
    <div class="flex items-center gap-6">
        <h1 class="text-xl font-bold tracking-wide">Monitoring Tasks</h1>
        <a href="/reports" class="text-sm text-slate-600 hover:text-blue-600 transition font-medium">Daily Reports</a>
    </div>
    <a href="/tasks/new"
       class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition">
        + Create Task
    </a>
</header>

<main class="px-8 py-6">

    <!-- Flash message -->
    <div th:if="${message}"
         class="mb-4 px-4 py-3 bg-green-50 border border-green-300 text-green-800 rounded-xl text-sm"
         th:text="${message}"></div>

    <!-- Search bar -->
    <div class="mb-3 flex items-center gap-3">
        <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
            </svg>
            <input type="text" id="searchInput"
                   placeholder="Task Name 또는 Type 검색..."
                   class="border border-slate-300 rounded-xl pl-9 pr-4 py-2 text-sm w-72 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        </div>
        <span id="rowCount" class="text-xs text-slate-400"></span>
    </div>

    <!-- Table card -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-sm table-fixed">
            <thead class="bg-slate-100 text-slate-900 text-xs tracking-wider">
            <tr>
                <th class="px-4 py-3 text-left w-14">
                    <button class="flex items-center gap-1 font-semibold hover:text-blue-600 transition" data-col="id">
                        ID <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-left">
                    <button class="flex items-center gap-1 font-semibold hover:text-blue-600 transition" data-col="nm">
                        Task Name <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-left w-44">
                    <button class="flex items-center gap-1 font-semibold hover:text-blue-600 transition" data-col="type">
                        Type <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-left w-32">
                    <button class="flex items-center gap-1 font-semibold hover:text-blue-600 transition" data-col="cron">
                        Cron <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-center w-20">
                    <button class="flex items-center justify-center gap-1 font-semibold hover:text-blue-600 transition w-full" data-col="prio">
                        Priority <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-center w-20">
                    <button class="flex items-center justify-center gap-1 font-semibold hover:text-blue-600 transition w-full" data-col="active">
                        Active <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-left">
                    <button class="flex items-center gap-1 font-semibold hover:text-blue-600 transition" data-col="dtm">
                        Last Executed <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-left">
                    <button class="flex items-center gap-1 font-semibold hover:text-blue-600 transition" data-col="result">
                        Last Result <span class="sort-icon text-slate-400">↕</span>
                    </button>
                </th>
                <th class="px-4 py-3 text-center w-38">Actions</th>
            </tr>
            </thead>
            <tbody id="taskTableBody" class="divide-y divide-slate-100">
            <tr th:each="task : ${tasks}"
                class="hover:bg-slate-50 transition"
                th:attr="data-id=${task.taskId},data-nm=${task.taskNm},data-type=${task.taskTypeCd},data-cron=${task.scheduleVal},data-prio=${task.taskPrio},data-active=${task.activeYn},data-dtm=${task.lastExecDtm != null ? #temporals.format(task.lastExecDtm, 'yyyy-MM-dd HH:mm:ss') : ''},data-result=${task.lastExecRslt ?: ''},data-search=${#strings.toLowerCase(task.taskNm) + ' ' + #strings.toLowerCase(task.taskTypeCd)}">
                <td class="px-4 py-3 text-slate-700 font-mono text-xs truncate" th:text="${task.taskId}"></td>
                <td class="px-4 py-3 font-medium max-w-0">
                    <a th:href="@{|/tasks/${task.taskId}|}" class="text-blue-700 hover:underline block truncate" th:text="${task.taskNm}"></a>
                </td>
                <td class="px-4 py-3 overflow-hidden">
                    <span class="text-blue-800 bg-gradient-to-br from-blue-100 to-blue-200 text-xs px-3 py-2 rounded-xl font-semibold inline-block truncate max-w-full" th:text="${task.taskTypeCd}"></span>
                </td>
                <td class="px-4 py-3 font-mono text-xs text-slate-600 truncate" th:text="${task.scheduleVal}"></td>
                <td class="px-4 py-3 text-center text-slate-600" th:text="${task.taskPrio}"></td>
                <td class="px-4 py-3 text-center">
                    <span th:if="${task.activeYn == 'Y'}"
                          class="inline-block bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full">Y</span>
                    <span th:if="${task.activeYn != 'Y'}"
                          class="inline-block bg-red-100 text-red-600 text-xs font-semibold px-2 py-0.5 rounded-full" th:text="${task.activeYn}"></span>
                </td>
                <td class="px-4 py-3 text-xs text-slate-700 truncate" th:text="${task.lastExecDtm != null ? #temporals.format(task.lastExecDtm, 'yyyy-MM-dd HH:mm:ss') : '-'}"></td>
                <td class="px-4 py-3 overflow-hidden">
                    <span th:text="${task.lastExecRslt}"
                          th:classappend="${task.lastExecRslt == 'SUCCESS'} ? 'text-green-700 font-semibold' : 'text-red-600 font-semibold'"></span>
                    <div class="text-xs text-slate-700 mt-0.5 truncate" th:text="${task.lastExecRsltMsg}"></div>
                </td>
                <td class="px-4 py-3">
                    <div class="flex items-center gap-1 justify-center">
                        <!-- Edit -->
                        <a th:href="@{|/tasks/${task.taskId}/edit|}" title="Edit"
                           class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-700 hover:text-slate-900 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487a2.25 2.25 0 1 1 3.182 3.182L7.5 20.213l-4.5 1.318 1.318-4.5L16.862 4.487z"/>
                            </svg>
                        </a>
                        <!-- History -->
                        <a th:href="@{|/tasks/${task.taskId}/histories|}" title="History"
                           class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-700 hover:text-slate-900 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 1 1-20 0 10 10 0 0 1 20 0z"/>
                            </svg>
                        </a>
                        <!-- Run Now -->
                        <form th:action="@{|/tasks/${task.taskId}/restart|}" method="post" class="inline">
                            <button type="submit" title="Run Now"
                                    class="p-1.5 rounded-xl hover:bg-blue-100 text-slate-700 hover:text-blue-700 transition cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347c-.75.412-1.667-.13-1.667-.986V5.653z"/>
                                </svg>
                            </button>
                        </form>
                        <!-- Deactivate -->
                        <form th:if="${task.activeYn == 'Y'}" th:action="@{|/tasks/${task.taskId}/delete|}" method="post" class="inline">
                            <button type="submit" title="Deactivate"
                                    class="p-1.5 rounded-xl hover:bg-red-100 text-slate-700 hover:text-red-600 transition cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636"/>
                                </svg>
                            </button>
                        </form>
                        <!-- Activate -->
                        <form th:if="${task.activeYn != 'Y'}" th:action="@{|/tasks/${task.taskId}/activate|}" method="post" class="inline">
                            <button type="submit" title="Activate"
                                    class="p-1.5 rounded-xl hover:bg-emerald-100 text-slate-700 hover:text-emerald-600 transition cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
<script>
(function () {
    const RESULT_ORDER = { 'ERROR': 0, 'FAILURE': 1, 'SUCCESS': 2, '': 3 };
    let sortState = { col: null, dir: null }; // null = 초기 정렬 (result → dtm desc)
    let searchQuery = '';

    function getRows() {
        return Array.from(document.querySelectorAll('#taskTableBody tr'));
    }

    function getSortValue(row, col) {
        switch (col) {
            case 'id':     return parseInt(row.dataset.id) || 0;
            case 'nm':     return (row.dataset.nm || '').toLowerCase();
            case 'type':   return (row.dataset.type || '').toLowerCase();
            case 'cron':   return (row.dataset.cron || '').toLowerCase();
            case 'prio':   return parseInt(row.dataset.prio) || 0;
            case 'active': return (row.dataset.active || '').toLowerCase();
            case 'dtm':    return row.dataset.dtm || '';
            case 'result': return RESULT_ORDER[row.dataset.result] ?? 3;
            default:       return '';
        }
    }

    function compare(a, b, col, dir) {
        const av = getSortValue(a, col);
        const bv = getSortValue(b, col);
        let cmp;
        if (typeof av === 'number' && typeof bv === 'number') {
            cmp = av - bv;
        } else {
            cmp = av < bv ? -1 : av > bv ? 1 : 0;
        }
        return dir === 'desc' ? -cmp : cmp;
    }

    function initialSort(rows) {
        return [...rows].sort(function (a, b) {
            const ra = RESULT_ORDER[a.dataset.result] ?? 3;
            const rb = RESULT_ORDER[b.dataset.result] ?? 3;
            if (ra !== rb) return ra - rb;
            // 결과가 같으면 Last Executed 내림차순 (최근 실행 먼저)
            const da = a.dataset.dtm || '';
            const db = b.dataset.dtm || '';
            return da > db ? -1 : da < db ? 1 : 0;
        });
    }

    function applyAll() {
        const tbody = document.getElementById('taskTableBody');
        const rows = getRows();

        // 1. 정렬
        const sorted = sortState.col === null
            ? initialSort(rows)
            : [...rows].sort(function (a, b) { return compare(a, b, sortState.col, sortState.dir); });

        // 2. DOM 순서 반영
        sorted.forEach(function (r) { tbody.appendChild(r); });

        // 3. 필터 (show/hide)
        const q = searchQuery.toLowerCase();
        let visibleCount = 0;
        sorted.forEach(function (row) {
            const match = !q || (row.dataset.search || '').includes(q);
            row.style.display = match ? '' : 'none';
            if (match) visibleCount++;
        });

        // 4. 건수 표시
        const countEl = document.getElementById('rowCount');
        if (countEl) {
            countEl.textContent = q
                ? visibleCount + ' / ' + rows.length + ' 건'
                : rows.length + ' 건';
        }
    }

    function updateSortIcons() {
        document.querySelectorAll('.sort-icon').forEach(function (icon) {
            const btn = icon.closest('[data-col]');
            if (!btn) return;
            const col = btn.dataset.col;
            if (sortState.col === col) {
                icon.textContent = sortState.dir === 'asc' ? '↑' : '↓';
                icon.classList.add('text-blue-600');
                icon.classList.remove('text-slate-400');
                btn.classList.add('text-blue-600');
            } else {
                icon.textContent = '↕';
                icon.classList.remove('text-blue-600');
                icon.classList.add('text-slate-400');
                btn.classList.remove('text-blue-600');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        // 초기 정렬 적용
        applyAll();

        // 검색
        document.getElementById('searchInput').addEventListener('input', function () {
            searchQuery = this.value;
            applyAll();
        });

        // 컬럼 정렬 클릭
        document.querySelectorAll('[data-col]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const col = this.dataset.col;
                if (sortState.col === col) {
                    if (sortState.dir === 'asc') {
                        sortState.dir = 'desc';
                    } else {
                        sortState = { col: null, dir: null }; // 초기 정렬로 복귀
                    }
                } else {
                    sortState = { col: col, dir: 'asc' };
                }
                updateSortIcons();
                applyAll();
            });
        });
    });

    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            location.reload();
        }
    });
})();
</script>
</body>
</html>
