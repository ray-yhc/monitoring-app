<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- Top Nav -->
<header class="bg-slate-900 text-white px-8 py-4 flex items-center justify-between shadow">
    <h1 class="text-xl font-bold tracking-wide">Monitoring Tasks</h1>
    <a href="/tasks/new"
       class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded transition">
        + Create Task
    </a>
</header>

<main class="px-8 py-6 max-w-screen-xl mx-auto">

    <!-- Flash message -->
    <div th:if="${message}"
         class="mb-4 px-4 py-3 bg-green-50 border border-green-300 text-green-800 rounded text-sm"
         th:text="${message}"></div>

    <!-- Table card -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-800 text-slate-100 uppercase text-xs tracking-wider">
            <tr>
                <th class="px-4 py-3 text-left">ID</th>
                <th class="px-4 py-3 text-left">Task Name</th>
                <th class="px-4 py-3 text-left">Type</th>
                <th class="px-4 py-3 text-left">Cron</th>
                <th class="px-4 py-3 text-center">Priority</th>
                <th class="px-4 py-3 text-center">Active</th>
                <th class="px-4 py-3 text-left">Last Executed</th>
                <th class="px-4 py-3 text-left">Last Result</th>
                <th class="px-4 py-3 text-center">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="task : ${tasks}" class="hover:bg-slate-50 transition">
                <td class="px-4 py-3 text-slate-500 font-mono text-xs" th:text="${task.taskId}"></td>
                <td class="px-4 py-3 font-medium">
                    <a th:href="@{|/tasks/${task.taskId}|}" class="text-blue-700 hover:underline" th:text="${task.taskNm}"></a>
                </td>
                <td class="px-4 py-3">
                    <span class="bg-slate-100 text-slate-700 text-xs px-2 py-1 rounded font-mono" th:text="${task.taskTypeCd}"></span>
                </td>
                <td class="px-4 py-3 font-mono text-xs text-slate-600" th:text="${task.scheduleVal}"></td>
                <td class="px-4 py-3 text-center text-slate-600" th:text="${task.taskPrio}"></td>
                <td class="px-4 py-3 text-center">
                    <span th:if="${task.activeYn == 'Y'}"
                          class="inline-block bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full">Y</span>
                    <span th:if="${task.activeYn != 'Y'}"
                          class="inline-block bg-red-100 text-red-600 text-xs font-semibold px-2 py-0.5 rounded-full" th:text="${task.activeYn}"></span>
                </td>
                <td class="px-4 py-3 text-xs text-slate-500" th:text="${task.lastExecDtm}"></td>
                <td class="px-4 py-3">
                    <span th:text="${task.lastExecRslt}"
                          th:classappend="${task.lastExecRslt == 'SUCCESS'} ? 'text-green-700 font-semibold' : 'text-red-600 font-semibold'"></span>
                    <div class="text-xs text-slate-400 mt-0.5 truncate max-w-xs" th:text="${task.lastExecRsltMsg}"></div>
                </td>
                <td class="px-4 py-3">
                    <div class="flex flex-wrap gap-1 justify-center">
                        <a th:href="@{|/tasks/${task.taskId}/edit|}"
                           class="text-xs px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Edit</a>
                        <a th:href="@{|/tasks/${task.taskId}/histories|}"
                           class="text-xs px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 transition">History</a>
                        <form th:action="@{|/tasks/${task.taskId}/restart|}" method="post" class="inline">
                            <button type="submit"
                                    class="text-xs px-2 py-1 rounded bg-blue-100 hover:bg-blue-200 text-blue-700 transition cursor-pointer">
                                Run Now
                            </button>
                        </form>
                        <form th:if="${task.activeYn == 'Y'}" th:action="@{|/tasks/${task.taskId}/delete|}" method="post" class="inline">
                            <button type="submit"
                                    class="text-xs px-2 py-1 rounded bg-red-100 hover:bg-red-200 text-red-600 transition cursor-pointer">
                                Deactivate
                            </button>
                        </form>
                        <form th:if="${task.activeYn != 'Y'}" th:action="@{|/tasks/${task.taskId}/activate|}" method="post" class="inline">
                            <button type="submit"
                                    class="text-xs px-2 py-1 rounded bg-emerald-100 hover:bg-emerald-200 text-emerald-700 transition cursor-pointer">
                                Activate
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
