<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Tasks</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; margin: 32px; background: #f4f7fb; color: #1d2a3a; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #dbe2ea; padding: 10px; text-align: left; vertical-align: top; }
        th { background: #0f2742; color: #fff; }
        .actions form { display: inline; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 8px 12px; background: #1f6feb; color: #fff; text-decoration: none; border: none; cursor: pointer; }
        .message { padding: 12px; background: #dff4e3; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="topbar">
    <h1>Monitoring Tasks</h1>
    <a class="btn" href="/tasks/new">Create Task</a>
</div>
<div class="message" th:if="${message}" th:text="${message}"></div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Task Name</th>
        <th>Type</th>
        <th>Cron</th>
        <th>Priority</th>
        <th>Active</th>
        <th>Last Executed</th>
        <th>Last Result</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.taskId}"></td>
        <td th:text="${task.taskNm}"></td>
        <td th:text="${task.taskTypeCd}"></td>
        <td th:text="${task.scheduleVal}"></td>
        <td th:text="${task.taskPrio}"></td>
        <td th:text="${task.activeYn}"></td>
        <td th:text="${task.lastExecDtm}"></td>
        <td>
            <div th:text="${task.lastExecRslt}"></div>
            <small th:text="${task.lastExecRsltMsg}"></small>
        </td>
        <td class="actions">
            <a th:href="@{|/tasks/${task.taskId}|}">Detail</a>
            <a th:href="@{|/tasks/${task.taskId}/edit|}">Edit</a>
            <a th:href="@{|/tasks/${task.taskId}/histories|}">History</a>
            <form th:action="@{|/tasks/${task.taskId}/restart|}" method="post">
                <button type="submit">Run Now</button>
            </form>
            <form th:action="@{|/tasks/${task.taskId}/delete|}" method="post">
                <button type="submit">Deactivate</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
