<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- Top Nav -->
<header class="bg-slate-900 text-white px-8 py-4 flex items-center gap-4 shadow">
    <a href="/tasks" class="text-slate-400 hover:text-white text-sm transition">Task List</a>
    <span class="text-slate-600">/</span>
    <h1 class="text-lg font-bold">
        <span th:if="${formMode == 'create'}">Create Task</span>
        <span th:if="${formMode != 'create'}">Edit Task</span>
    </h1>
</header>

<main class="px-8 py-6 max-w-screen-lg mx-auto space-y-6">

    <!-- Form Card -->
    <div class="bg-white rounded-lg shadow p-8">

        <form method="post" th:object="${taskForm}" th:attr="action=${formAction}" class="space-y-5">
            <!-- Validation Errors -->
            <div th:if="${#fields.hasAnyErrors()}"
                 class="mb-6 px-4 py-3 bg-red-50 border border-red-300 rounded text-sm text-red-700 space-y-1">
                <div th:each="error : ${#fields.errors('*')}" th:text="${error}"></div>
            </div>

            <input type="hidden" th:if="${taskForm.taskId != null}" th:field="*{taskId}">

            <!-- Task Name -->
            <div>
                <label for="taskNm" class="block text-sm font-semibold text-slate-700 mb-1">Task Name</label>
                <input id="taskNm" type="text" th:field="*{taskNm}"
                       class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <!-- Row: Type + Active -->
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label for="taskTypeCd" class="block text-sm font-semibold text-slate-700 mb-1">Task Type</label>
                    <select id="taskTypeCd" th:field="*{taskTypeCd}"
                            class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="URL_HEALTH_CHECK">URL_HEALTH_CHECK</option>
                        <option value="URL_RESPONSE_CHECK">URL_RESPONSE_CHECK</option>
                        <option value="DB_QUERY_CHECK">DB_QUERY_CHECK</option>
                        <option value="DB_TEMPLATE_CHECK">DB_TEMPLATE_CHECK</option>
                        <option value="ES_LOG_CHECK">ES_LOG_CHECK</option>
                        <option value="PROM_QL_CHECK">PROM_QL_CHECK</option>
                    </select>
                </div>
                <div>
                    <label for="activeYn" class="block text-sm font-semibold text-slate-700 mb-1">Active</label>
                    <select id="activeYn" th:field="*{activeYn}"
                            class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Y">Y</option>
                        <option value="N">N</option>
                    </select>
                </div>
            </div>

            <!-- Description -->
            <div>
                <label for="taskCntnt" class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
                <input id="taskCntnt" type="text" th:field="*{taskCntnt}"
                       class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Report Groups -->
            <div>
                <p class="block text-sm font-semibold text-slate-700 mb-2">Report Groups</p>
                <div class="border border-slate-300 rounded p-3 max-h-52 overflow-auto space-y-2">
                    <label th:each="group : ${reportGroups}" class="flex items-start gap-2 text-sm text-slate-700">
                        <input type="checkbox"
                               th:field="*{reportGroupIds}"
                               th:value="${group.reportGroupId}"
                               class="mt-0.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span class="inline-flex flex-col">
                            <span>
                                <span class="font-medium" th:text="${group.reportGroupName}"></span>
                                <span th:text="${' (#' + group.reportGroupId + ')'}" class="text-xs text-slate-400"></span>
                            </span>
                            <span th:if="${group.description != null and !#strings.isEmpty(group.description)}"
                                  th:text="${group.description}" class="text-xs text-slate-500"></span>
                        </span>
                    </label>
                    <p th:if="${#lists.isEmpty(reportGroups)}" class="text-xs text-slate-500">No report groups available.</p>
                </div>
            </div>

            <!-- Row: Cron + Priority -->
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label for="scheduleVal" class="block text-sm font-semibold text-slate-700 mb-1">Cron</label>
                    <input id="scheduleVal" type="text" th:field="*{scheduleVal}" placeholder="0 * * * * *"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="taskPrio" class="block text-sm font-semibold text-slate-700 mb-1">Priority</label>
                    <input id="taskPrio" type="number" th:field="*{taskPrio}"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Execution Param -->
            <div>
                <label for="execParam" class="block text-sm font-semibold text-slate-700 mb-1">Execution Param JSON</label>
                <textarea id="execParam" th:field="*{execParam}" rows="8"
                          class="w-full border border-slate-300 rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
            </div>

            <!-- Success Param -->
            <div>
                <label for="successParam" class="block text-sm font-semibold text-slate-700 mb-1">Success Param JSON</label>
                <textarea id="successParam" th:field="*{successParam}" rows="6"
                          class="w-full border border-slate-300 rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2 rounded transition cursor-pointer">
                    Save
                </button>
                <a href="/tasks"
                   class="text-sm text-slate-600 hover:text-slate-900 px-4 py-2 rounded border border-slate-300 hover:border-slate-400 transition">
                    Cancel
                </a>
            </div>

        </form>
    </div>

    <!-- JSON Examples -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">JSON Examples</h2>
        <div th:each="entry : ${taskTypeExamples}" class="mb-5">
            <p class="text-sm font-semibold text-slate-700 mb-2" th:text="${entry.key}"></p>
            <pre class="bg-slate-900 text-slate-100 text-xs rounded p-4 overflow-auto leading-relaxed whitespace-pre-wrap"
                 th:text="${entry.value}"></pre>
        </div>
    </div>

</main>
</body>
</html>
